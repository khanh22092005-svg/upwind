<svg viewBox="0 0 420 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SmartSolar">
  <!-- Sun -->
  <circle cx="44" cy="31" r="13" fill="#FFD84D"/>
  <!-- Rays (8 directions) -->
  <line x1="44" y1="13" x2="44" y2="6"  stroke="#FFD84D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="44" y1="49" x2="44" y2="56" stroke="#FFD84D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="26" y1="31" x2="19" y2="31" stroke="#FFD84D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="62" y1="31" x2="69" y2="31" stroke="#FFD84D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="56.7" y1="18.3" x2="61.7" y2="13.3" stroke="#FFD84D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="31.3" y1="43.7" x2="26.3" y2="48.7" stroke="#FFD84D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="56.7" y1="43.7" x2="61.7" y2="48.7" stroke="#FFD84D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="31.3" y1="18.3" x2="26.3" y2="13.3" stroke="#FFD84D" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Ground baseline -->
  <rect x="4"  y="82" width="76" height="4" rx="2" fill="#FFD84D"/>

  <!-- Left solar array (shorter) -->
  <rect x="6"  y="65" width="24" height="16" rx="3" fill="#FFD84D"/>
  <line x1="6"  y1="73" x2="30" y2="73" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="18" y1="65" x2="18" y2="81" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- support -->
  <rect x="15" y="79" width="6" height="5" rx="1" fill="#FFD84D"/>

  <!-- Middle solar array (taller) -->
  <rect x="33" y="56" width="24" height="25" rx="3" fill="#FFD84D"/>
  <line x1="33" y1="68.5" x2="57" y2="68.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="45" y1="56"   x2="45" y2="81"   stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- support -->
  <rect x="42" y="79" width="6" height="5" rx="1" fill="#FFD84D"/>

  <!-- Right solar array (shorter) -->
  <rect x="60" y="65" width="24" height="16" rx="3" fill="#FFD84D"/>
  <line x1="60" y1="73" x2="84" y2="73" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="72" y1="65" x2="72" y2="81" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- support -->
  <rect x="69" y="79" width="6" height="5" rx="1" fill="#FFD84D"/>

  <!-- SmartSolar text -->
  <text x="96" y="66"
        font-family="'Be Vietnam Pro', 'Arial Rounded MT Bold', Arial, sans-serif"
        font-size="50" font-weight="900" fill="#FFD84D" letter-spacing="-1">SmartSolar</text>
</svg>
